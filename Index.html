<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAD RUDI AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-amber-500 border border-zinc-700">BR</div>
            <div>
                <h1 class="font-bold tracking-wide">BAD RUDI</h1>
                <p class="text-xs text-zinc-400">Online & Unbothered</p>
            </div>
        </div>
        <span class="px-2.5 py-1 text-xs rounded-full bg-red-950 text-red-400 border border-red-800">Sarcastic Mode</span>
    </header>

    <!-- Chat Box / Main Display -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-zinc-800 flex-shrink-0 flex items-center justify-center text-xs font-bold text-amber-500">BR</div>
            <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl max-w-md text-sm text-zinc-300">
                What do you want now? Make it quick, I'm busy doing absolutely nothing of importance. 🐻‍❄️
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-zinc-900 border-t border-zinc-800 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Say something to Rudi..." 
                class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-amber-500"
                autocomplete="off"
            >
            <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold px-5 py-3 rounded-xl text-sm transition">
                Send
            </button>
        </form>
    </footer>

    <!-- Simple Script for Persona Interaction -->
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');

        const rudiResponses = [
            "Yeah, sure, let me get right on that... right after a nap.",
            "Are you actually serious with that question right now?",
            "Bro really thought that was a good idea. Unreal.",
            "I'd agree with you, but then we'd both be wrong.",
            "Error 404: Motivation to care not found."
        ];

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Append User Message
            container.innerHTML += `
                <div class="flex items-start space-x-3 justify-end">
                    <div class="bg-amber-600 text-zinc-950 p-3.5 rounded-2xl max-w-md text-sm font-medium">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Simulate Rudi's sarcastic reply after a short delay
            setTimeout(() => {
                const randomReply = rudiResponses[Math.floor(Math.random() * rudiResponses.length)];
                container.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-800 flex-shrink-0 flex items-center justify-center text-xs font-bold text-amber-500">BR</div>
                        <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl max-w-md text-sm text-zinc-300">
                            ${randomReply}
                        </div>
                    </div>
                `;
                container.scrollTop = container.scrollHeight;
            }, 600);
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
